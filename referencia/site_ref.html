<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Forevergold</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap">
<style id="fg-css">/* Layout: "o estojo" — veludo verde-noite por fora, forro de marfim por dentro; uma coluna larga, grelhas assimétricas e filetes dourados a marcar o ritmo. */
:root{
  --noite:#0B1411; --veludo:#11201A; --veludo-2:#182B24;
  --marfim:#F4EEE1; --marfim-2:#E9E0CC; --tinta:#17201C;
  --ouro:#C6A766; --ouro-claro:#EBD7A4; --ouro-escuro:#77602C; --ouro-logo:#A6894B;
  --texto:#EEE7D7; --texto-suave:#B8B6A8; --tinta-suave:#55605A;
  --branco:#FFFDF8; --erro:#B4472F; --whats:#1F8F55;
  --f-display:"Bodoni Moda","Bodoni 72","Didot","Bodoni MT",Georgia,serif;
  --f-texto:"Jost","Century Gothic","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --f-gravar:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --wrap:1240px; --gut:clamp(20px,5vw,56px); --topo:72px;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--noite);color:var(--texto);font-family:var(--f-texto);font-size:1.0625rem;line-height:1.65;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html.trancado,html.trancado body{overflow:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--ouro);outline-offset:3px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.tema-escuro{--bg:var(--noite);--fg:var(--texto);--fg2:var(--texto-suave);--ac:var(--ouro);--ln:rgba(198,167,102,.26);--card:var(--veludo)}
.tema-veludo{--bg:var(--veludo);--fg:var(--texto);--fg2:var(--texto-suave);--ac:var(--ouro);--ln:rgba(198,167,102,.26);--card:var(--veludo-2)}
.tema-claro{--bg:var(--marfim);--fg:var(--tinta);--fg2:var(--tinta-suave);--ac:var(--ouro-escuro);--ln:rgba(119,96,44,.32);--card:var(--branco)}
.sec{background:var(--bg);color:var(--fg);padding-block:clamp(72px,10vw,140px);position:relative;scroll-margin-top:calc(var(--topo) - 2px)}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gut)}

.kicker{font-size:.8rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);display:flex;align-items:center;gap:14px}
.kicker::before{content:"";width:34px;height:1px;background:currentColor;flex:none}
.h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,4.3vw,3.5rem);line-height:1.06;letter-spacing:-.012em;text-wrap:balance}
.h2 em{font-style:italic;color:var(--ac)}
.lead{font-size:clamp(1.08rem,1.4vw,1.25rem);line-height:1.6;color:var(--fg);max-width:34em}
.txt{color:var(--fg2);max-width:36em}
.pilha{display:flex;flex-direction:column;gap:22px}
.botoes{display:flex;flex-wrap:wrap;gap:14px}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border:1px solid var(--ac);background:transparent;color:var(--fg);font-size:.86rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;overflow:hidden;transition:color .35s,background .35s,border-color .35s,transform .35s var(--ease);isolation:isolate}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.btn:hover::after{transform:translateX(120%)}
.btn:hover{transform:translateY(-2px)}
.btn--ouro{background:linear-gradient(120deg,#B4944F,#E4CC92 48%,#BC9C57);border-color:transparent;color:#1B1608}
.btn--linha:hover{background:rgba(198,167,102,.12)}
.tema-claro .btn--linha:hover{background:rgba(119,96,44,.1)}
.btn--whats{background:var(--whats);border-color:var(--whats);color:#fff}
.btn--cheio{width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
.lk{color:var(--ac);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;background:none;border:0;padding:0;font-size:.95rem}
.lk:hover{text-decoration-thickness:2px}

/* animações de entrada: só quando o JS liga a classe .anim */
.anim [data-r]{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform 1.1s var(--ease);transition-delay:var(--d,0s)}
.anim [data-r="esq"]{transform:translateX(-34px)}
.anim [data-r="dir"]{transform:translateX(34px)}
.anim [data-r="zoom"]{transform:scale(.94)}
.anim [data-r].in{opacity:1;transform:none}
.anim .filete{transform:scaleX(0);transform-origin:left;transition:transform 1.4s var(--ease);transition-delay:var(--d,0s)}
.anim .filete.in{transform:none}
.filete{height:1px;background:var(--ln);border:0;margin:0}

/* ===== topo ===== */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--topo);background:rgba(11,20,17,0);border-bottom:1px solid transparent;transition:background .4s,border-color .4s,backdrop-filter .4s;color:var(--texto);margin-bottom:calc(var(--topo) * -1)}
.topo.solido{background:rgba(11,20,17,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:rgba(198,167,102,.2)}
.topo__in{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}
.marca{display:flex;align-items:center;gap:12px;color:var(--ouro);text-decoration:none;flex:none}
.marca__s{width:46px;height:30px}
.marca__w{width:168px;height:15px}
.nav{display:flex;gap:clamp(14px,2vw,30px)}
.nav a{font-size:.8rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--texto);padding:8px 0;position:relative;white-space:nowrap}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--ouro);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.nav a:hover::after,.nav a.ativo::after{transform:scaleX(1);transform-origin:left}
.topo__acoes{display:flex;align-items:center;gap:6px}
.icone-btn{position:relative;width:48px;height:48px;display:grid;place-items:center;background:none;border:0;color:var(--ouro);border-radius:50%}
.icone-btn svg{width:24px;height:24px}
.icone-btn:hover{background:rgba(198,167,102,.12)}
.carrinho-n{position:absolute;top:4px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ouro);color:#1B1608;font-size:.72rem;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.carrinho-n.salta{animation:salta .5s var(--ease)}
@keyframes salta{40%{transform:scale(1.5)}}
.menu-btn{display:none}
.menu{position:fixed;inset:0;z-index:60;background:var(--noite);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gut) 32px;transform:translateY(-100%);transition:transform .6s var(--ease);visibility:hidden}
.menu.aberto{transform:none;visibility:visible}
.menu__topo{display:flex;justify-content:space-between;align-items:center;height:56px}
.menu nav{display:flex;flex-direction:column;margin-top:24px}
.menu nav a{font-family:var(--f-display);font-size:2rem;line-height:1.2;text-decoration:none;color:var(--texto);padding:12px 0;border-bottom:1px solid rgba(198,167,102,.2)}

/* ===== herói ===== */
.hero{background:radial-gradient(120% 90% at 78% 30%,#1A3028 0%,var(--noite) 62%);color:var(--texto);padding-top:calc(var(--topo) + clamp(40px,7vw,96px));position:relative;overflow:hidden;--ac:var(--ouro);--fg:var(--texto);--fg2:var(--texto-suave)}
.hero__po{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero__grid{position:relative;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:clamp(24px,4vw,64px);align-items:center;padding-bottom:clamp(48px,7vw,96px)}
.hero__txt{display:flex;flex-direction:column;gap:26px;min-width:0}
.hero__h{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,6.1vw,5.3rem);line-height:1.02;letter-spacing:-.018em}
.hero__h .pal{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.hero__h .pal>span{display:inline-block}
.anim .hero__h .pal>span{animation:sobe 1.1s var(--ease) both;animation-delay:calc(.25s + var(--i) * .07s)}
@keyframes sobe{from{transform:translateY(110%) rotate(4deg)}}
.hero__h .dour{font-style:italic;background:linear-gradient(100deg,#B4944F 0%,#F0DDAA 35%,#C6A766 55%,#F3E3B5 80%,#B4944F 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brilho 7s linear infinite;padding-right:.08em}
@keyframes brilho{to{background-position:-220% 0}}
.hero__sub{font-size:clamp(1.08rem,1.45vw,1.28rem);line-height:1.6;color:var(--texto-suave);max-width:31em}
.anim .hero .sobe2{animation:aparece 1.2s var(--ease) both;animation-delay:var(--d,.9s)}
@keyframes aparece{from{opacity:0;transform:translateY(18px)}}
.hero__simbolo{position:relative;min-width:0;perspective:900px}
.hero__simbolo>svg{width:100%;height:auto;overflow:visible;transition:transform .6s var(--ease);filter:drop-shadow(0 30px 60px rgba(0,0,0,.45))}
.hs-traco{fill:none;stroke:var(--ouro-claro);stroke-width:3;stroke-linejoin:round}
.hs-cheio{fill:url(#fg-ouro)}
.anim .hs-traco{stroke-dasharray:1;stroke-dashoffset:1;animation:desenha 2.6s cubic-bezier(.6,.05,.2,1) .2s forwards,some .9s ease 2.6s forwards}
.anim .hs-cheio{opacity:0;animation:enche 1.3s ease 2.2s forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
@keyframes some{to{opacity:0}}
@keyframes enche{to{opacity:1}}
.hs-halo{fill:none;stroke:rgba(198,167,102,.16);stroke-width:1}
.anim .hs-halo{animation:halo 9s ease-in-out infinite;transform-origin:50% 50%;transform-box:fill-box}
@keyframes halo{50%{transform:scale(1.06);opacity:.4}}
.fita{position:relative;border-block:1px solid rgba(198,167,102,.22);overflow:hidden;padding-block:18px;background:rgba(11,20,17,.5)}
.fita__in{display:flex;width:max-content;gap:0;animation:corre 46s linear infinite}
.fita:hover .fita__in{animation-play-state:paused}
.fita__g{display:flex;align-items:center;flex:none}
.fita__g span{font-family:var(--f-display);font-style:italic;font-size:clamp(1.15rem,1.9vw,1.6rem);color:var(--texto);white-space:nowrap;padding-inline:26px}
.fita__g i{width:7px;height:7px;background:var(--ouro);transform:rotate(45deg);flex:none}
@keyframes corre{to{transform:translateX(-50%)}}

/* ===== a casa ===== */
.casa__grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,96px);align-items:start}
.casa__esq{display:flex;flex-direction:column;gap:28px;position:sticky;top:calc(var(--topo) + 32px)}
.casa__dir{display:flex;flex-direction:column;gap:24px}
.casa__dir p{font-size:clamp(1.08rem,1.35vw,1.22rem);line-height:1.72;color:var(--fg);max-width:35em}
.casa__dir p:first-child::first-letter{font-family:var(--f-display);font-size:4.3em;float:left;line-height:.82;padding:.06em .1em 0 0;color:var(--ac)}
.ficha{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:clamp(40px,6vw,72px);border-top:1px solid var(--ln)}
.ficha>div{padding:26px 24px 4px 0;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--ln);padding-left:24px}
.ficha>div:first-child{padding-left:0}
.ficha>div:last-child{border-right:0}
.ficha dt{font-size:.76rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ac);font-weight:500}
.ficha dd{margin:0;font-family:var(--f-display);font-size:clamp(1.15rem,1.7vw,1.45rem);line-height:1.3}

.casa__s{width:132px;height:auto;color:var(--ouro-logo);margin-top:8px}
.anim .casa__s{opacity:0;transition:opacity 1.6s ease .4s}
.anim .casa__esq:has(.in) .casa__s{opacity:1}
/* ===== compra ===== */
.compra{overflow:hidden}
.gigante{position:absolute;left:0;top:clamp(24px,4vw,60px);white-space:nowrap;font-family:var(--f-display);font-size:clamp(7rem,21vw,19rem);line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(198,167,102,.2);pointer-events:none;user-select:none;will-change:transform}
.compra__grid{position:relative;display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,88px);align-items:center}
.toque{background:linear-gradient(160deg,rgba(24,43,36,.92),rgba(17,32,26,.92));border:1px solid var(--ln);padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:18px}
.toque__t{font-family:var(--f-display);font-size:1.5rem;line-height:1.2}
.toque__s{font-size:.95rem;color:var(--fg2)}
.toque__l{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.tq{display:grid;grid-template-columns:5.2em minmax(0,1fr) 3.6em;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.tq b{font-weight:500;font-size:.98rem;white-space:nowrap}
.tq small{display:block;font-size:.72rem;letter-spacing:.08em;color:var(--fg2);text-transform:uppercase;line-height:1.2}
.tq__b{height:10px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.tq__b i{position:absolute;inset:0;background:linear-gradient(90deg,#9C7E3F,#EBD7A4 60%,#C6A766);transform-origin:left;transform:scaleX(var(--v))}
.tq--prata .tq__b i{background:linear-gradient(90deg,#8D9391,#F1F3F2 60%,#B9BEBC)}
.anim .tq__b i{transform:scaleX(0);transition:transform 1.5s var(--ease);transition-delay:var(--d,0s)}
.anim .toque.in .tq__b i{transform:scaleX(var(--v))}
.tq__v{text-align:right;font-size:.95rem;color:var(--ouro-claro)}
.tq--prata .tq__v{color:#DADEDC}
.passos{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(48px,7vw,96px)}
.passo{display:flex;flex-direction:column;gap:10px;padding-top:22px;border-top:1px solid var(--ln)}
.passo__n{font-family:var(--f-display);font-style:italic;font-size:2.6rem;line-height:1;color:var(--ac)}
.passo h3{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1.2}
.passo p{color:var(--fg2);font-size:1rem}

/* ===== penhor ===== */
.penhor__grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,6vw,96px);align-items:center}
.orb{width:100%;max-width:520px;margin-inline:auto}
.orb>svg{width:100%;height:auto;overflow:visible}
.orb__pista{fill:none;stroke:var(--ln);stroke-width:1;stroke-dasharray:2 7}
.orb__gira{transform-origin:260px 260px;animation:gira 12s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.orb__cauda{fill:none;stroke:url(#fg-cauda);stroke-width:3;stroke-linecap:round}
.orb__ponto{fill:var(--ouro-logo)}
.orb__no circle{fill:var(--marfim);stroke:var(--ouro-escuro);stroke-width:1.5;animation:acende 12s linear infinite;animation-delay:var(--t)}
.orb__no text{font-family:var(--f-display);font-style:italic;font-size:22px;fill:var(--ouro-escuro);text-anchor:middle}
@keyframes acende{0%{fill:var(--ouro-claro);transform:scale(1.32)}12%{fill:var(--marfim);transform:scale(1)}100%{fill:var(--marfim);transform:scale(1)}}
.orb__centro{font-family:var(--f-display);font-size:19px;fill:var(--tinta);text-anchor:middle}
.orb__centro2{font-size:11.5px;letter-spacing:.2em;fill:var(--tinta-suave);text-anchor:middle;font-family:var(--f-texto);font-weight:500}
.ciclo{display:flex;flex-direction:column;border-top:1px solid var(--ln)}
.ciclo li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--ln)}
.ciclo b{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:1.5rem;color:var(--ac)}
.ciclo span{font-size:1.08rem}
.nota{font-size:.95rem;color:var(--fg2);display:flex;gap:10px;align-items:flex-start}
.nota svg{width:18px;height:18px;flex:none;margin-top:4px;color:var(--ac)}

/* ===== gravação a laser ===== */
.laser__grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,5vw,80px);align-items:center}
.gravador{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.campo{display:flex;flex-direction:column;gap:8px}
.campo>label,.campo>.rot{font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);font-weight:500}
.inp{width:100%;min-height:52px;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid var(--ln);color:var(--fg);font-size:1.06rem;border-radius:0;appearance:none}
.inp:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(198,167,102,.18)}
.tema-claro .inp,.painel .inp{background:var(--branco)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 16px;border:1px solid var(--ln);background:transparent;color:var(--fg);font-size:.9rem;letter-spacing:.04em;transition:background .3s,color .3s,border-color .3s}
.chip:hover{border-color:var(--ac)}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#1B1608}
.palco{position:relative;background:radial-gradient(90% 80% at 50% 40%,#1C332B,#0E1915 75%);border:1px solid var(--ln);aspect-ratio:600/400;width:100%;overflow:hidden}
.palco>svg{width:100%;height:100%}
.palco__leg{position:absolute;left:16px;bottom:12px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--texto-suave)}
.grav-letra{font-family:var(--f-display);font-style:italic}
.grav-letra.manuscrita{font-family:var(--f-gravar);font-style:normal}

/* ===== oficina ===== */
.oficina__grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:center}
.relogio{width:100%;max-width:440px;margin-inline:auto}
.relogio>svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 26px 40px rgba(0,0,0,.45))}
.rel-hora{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--fg2);text-align:center;margin-top:18px;font-variant-numeric:tabular-nums}
.servs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--ln)}
.servs li{padding:14px 12px 14px 0;border-bottom:1px solid var(--ln);font-size:1.02rem;display:flex;gap:10px;align-items:center}
.servs li::before{content:"";width:6px;height:6px;background:var(--ac);transform:rotate(45deg);flex:none}

/* ===== loja ===== */
.loja__cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 48px}
.loja__cab .pilha{flex:1 1 420px;min-width:0}
.abas-w{margin-top:clamp(32px,5vw,56px);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ln);margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut)}
.abas-w::-webkit-scrollbar{display:none}
.abas{position:relative;display:flex;gap:clamp(18px,3vw,38px);width:max-content}

      '</div></section>';
  }

  function engrenagem(cx, cy, ro, ri, n) {
    let d = ''; const st = Math.PI * 2 / n;
    const p = (r, t) => (cx + r * Math.cos(t)).toFixed(1) + ' ' + (cy + r * Math.sin(t)).toFixed(1);
    for (let i = 0; i < n; i++) { const a = i * st; d += (i ? 'L' : 'M') + p(ri, a) + 'L' + p(ro, a + st * 0.16) + 'L' + p(ro, a + st * 0.42) + 'L' + p(ri, a + st * 0.58); }
    return d + 'Z';
  }
  function oficina() {
    let marcas = '';
    for (let i = 0; i < 60; i++) {
      const g = i % 5 === 0, q = i % 15 === 0;
      marcas += '<line x1="200" y1="' + (g ? 86 : 78) + '" x2="200" y2="' + (g ? (q ? 106 : 100) : 82) + '" stroke="' + (g ? '#EBD7A4' : '#C6A766') + '" stroke-opacity="' + (g ? 1 : 0.45) + '" stroke-width="' + (q ? 4 : g ? 2.4 : 1) + '" transform="rotate(' + i * 6 + ' 200 220)"/>';
    }
    return '<section class="sec tema-veludo" id="oficina"><div class="wrap oficina__grid">' +
      '<div class="pilha"><p class="kicker" data-r>Oficina</p><h2 class="h2" data-r style="--d:.08s">' + esc(S.oficina.titulo) + '</h2><p class="lead" data-r style="--d:.16s">' + esc(S.oficina.texto) + '</p>' +
      '<ul class="servs" data-r style="--d:.22s"><li>Reparação de relógios</li><li>Reparação de peças em ouro</li><li>Reparação de peças em prata</li><li>Gravação a laser</li></ul>' +
      '<div class="botoes" data-r style="--d:.3s"><a class="btn btn--linha" href="#lojas" data-ir="lojas">Levar a uma loja</a></div></div>' +
      '<div class="relogio" data-r="zoom" aria-hidden="true"><svg viewBox="0 0 400 440" id="relogio"><defs><clipPath id="fg-jan"><circle cx="200" cy="296" r="42"/></clipPath><radialGradient id="fg-most" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#1B332A"/><stop offset="1" stop-color="#09110E"/></radialGradient></defs>' +
      '<rect x="374" y="207" width="18" height="26" rx="5" fill="url(#fg-ouro)"/><circle cx="200" cy="220" r="178" fill="url(#fg-ouro)"/><circle cx="200" cy="220" r="162" fill="#0A120F"/><circle cx="200" cy="220" r="154" fill="url(#fg-most)"/>' + marcas +
      '<svg x="174" y="126" width="52" height="33.800" viewBox="0 0 ' + LOGO.symw + ' 1000" style="color:#C6A766"><use href="#fg-s"/></svg>' +
      '<svg x="141" y="168" width="118" height="10.100" viewBox="0 0 ' + LOGO.ww + ' ' + LOGO.wh + '" style="color:#C6A766"><use href="#fg-w"/></svg>' +
      '<circle cx="200" cy="296" r="42" fill="#060B09"/><g clip-path="url(#fg-jan)"><path id="rel-g1" d="' + engrenagem(184, 290, 30, 24, 14) + '" fill="none" stroke="#C6A766" stroke-width="2"/><circle cx="184" cy="290" r="12" fill="none" stroke="#C6A766" stroke-width="1.5"/><path id="rel-g2" d="' + engrenagem(226, 312, 21, 16, 10) + '" fill="none" stroke="#EBD7A4" stroke-width="2"/><circle cx="184" cy="290" r="3" fill="#B4472F"/><circle cx="226" cy="312" r="3" fill="#B4472F"/></g><circle cx="200" cy="296" r="42" fill="none" stroke="url(#fg-ouro)" stroke-width="3"/>' +
      '<line id="rel-h" x1="200" y1="232" x2="200" y2="142" stroke="url(#fg-ouro)" stroke-width="8" stroke-linecap="round"/><line id="rel-m" x1="200" y1="236" x2="200" y2="104" stroke="url(#fg-ouro)" stroke-width="5" stroke-linecap="round"/>' +

      '<p class="rel-hora">A hora certa, agora: <span id="rel-txt">--:--:--</span></p></div>' +
      '</div></section>';
  }

  let abaLoja = 'todos';
  function cartao(p, i) {
    const img = p.img ? '<img src="' + esc(p.img) + '" alt="' + esc(p.nome) + '" loading="lazy">' : glifo(p.cat);
    const preco = p.preco == null || p.preco === '' ? '<span class="prod__p consulta">Preço sob consulta</span>' : '<span class="prod__p">' + euro(p.preco) + '</span>';
    return '<article class="prod" style="--i:' + i + '" data-prod="' + esc(p.id) + '"><div class="prod__img">' + img + (p.exemplo ? '<span class="selo">Exemplo</span>' : '') + (p.esgotado ? '<span class="selo selo--esg">Esgotado</span>' : '') + '</div>' +
      '<div class="prod__c"><span class="prod__cat">' + esc(catNome(p.cat)) + '</span><h3 class="prod__n">' + esc(p.nome) + '</h3>' + (p.desc ? '<p class="prod__d">' + esc(p.desc) + '</p>' : '') +
      '<div class="prod__f">' + preco + '<button type="button" class="junta" data-junta="' + esc(p.id) + '"' + (p.esgotado ? ' disabled' : '') + '>Adicionar</button></div></div></article>';
  }
  function grelhaLoja() {
    const l = S.produtos.filter((p) => abaLoja === 'todos' || p.cat === abaLoja);
    return l.length ? l.map(cartao).join('') : '<p class="vazio">Ainda não há artigos nesta secção. Fale connosco para saber o que temos em loja.</p>';
  }
  function loja() {
    const n = (c) => S.produtos.filter((p) => p.cat === c).length;
    const abas = [{ id: 'todos', nome: 'Tudo', q: S.produtos.length }].concat(CATS.map((c) => ({ id: c.id, nome: c.nome, q: n(c.id) })))
      .map((c) => '<button type="button" role="tab" class="aba" data-aba="' + c.id + '" aria-selected="' + (c.id === abaLoja) + '">' + c.nome + '<sup>' + c.q + '</sup></button>').join('');
    return '<section class="sec tema-claro" id="loja"><div class="wrap">' +
      '<div class="loja__cab"><div class="pilha"><p class="kicker" data-r>Loja online</p><h2 class="h2" data-r style="--d:.08s">' + esc(S.loja.titulo) + '</h2><p class="txt" data-r style="--d:.16s">' + esc(S.loja.texto) + '</p></div>' +
      '<button type="button" class="btn btn--linha" data-act="cesto" data-r style="--d:.2s">' + IC.saco + 'Ver carrinho (<span data-cesto-n>0</span>)</button></div>' +

  function avaliacoes() {
    const rs = S.reviews.filter((r) => r.texto);
    const cartaoA = (r) => '<figure class="aval">' + estrelas(Math.max(1, Math.min(5, Number(r.estrelas) || 5))) + '<blockquote>«' + esc(r.texto) + '»</blockquote><figcaption><b>' + esc(r.nome || 'Cliente') + '</b>' + (r.loja ? ' · ' + esc(r.loja) : '') + ' · Google</figcaption></figure>';
    let corpo = '';
    if (rs.length > 3 && !reduz) {
      const g = rs.map(cartaoA).join('');
      corpo = '<div class="aval-fita" data-r><div class="aval-fita__in" style="--dur:' + Math.max(40, rs.length * 9) + 's">' + g + g.replace(/<figure /g, '<figure aria-hidden="true" ') + '</div></div>';
    } else if (rs.length) {
      corpo = '<div class="aval-grelha">' + rs.map((r, i) => cartaoA(r).replace('<figure class="aval"', '<figure class="aval" data-r style="--d:' + i * 0.1 + 's"')).join('') + '</div>';

  /* ============ arranque ============ */
  desenhaSite();
  montaCesto();
  if (sessao.get('fg-publicado')) { sessao.del('fg-publicado'); setTimeout(() => aviso('Alterações publicadas. O site já está atualizado.', 4200), 600); }
  if (D.fonts && D.fonts.ready) D.fonts.ready.then(linhaAbas);
  W.addEventListener('beforeunload', (e) => { if (sujo) { e.preventDefault(); e.returnValue = ''; } });
  (async function ligaEdicao() {
    try {
      if (!W.claude || !W.claude.use) return;
      const [art, user] = await Promise.all([W.claude.use('artifact'), W.claude.use('user')]);
      if (!art) return;
      let pode = false; try { pode = !!(user && await user.canEdit()); } catch (e) {}
      if (!pode && !(user == null && /^#editar$/.test(W.location.hash))) return;
      artefacto = art; montaEditor();
    } catch (e) {}
  })();
})();</script>
